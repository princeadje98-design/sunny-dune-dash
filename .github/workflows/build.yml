name: Construire l'application Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trouver le dossier du jeu
        run: |
          d=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -1)")
          echo "APP_DIR=$d" >> $GITHUB_ENV
          echo "Dossier trouvé : $d"

      - name: Mettre la bibliothèque de pubs à jour (correction)
        working-directory: ${{ env.APP_DIR }}
        run: |
          sed -i 's/google_mobile_ads:.*/google_mobile_ads: ^9.0.0/' pubspec.yaml
          cat pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version de Flutter utilisée
        run: flutter --version

      - name: Créer la partie Android du projet
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir /tmp/save
          cp -r lib /tmp/save/lib
          cp pubspec.yaml /tmp/save/pubspec.yaml
          flutter create --org com.sunnydune --project-name sunny_dune_dash --platforms=android .
          rm -rf lib test
          cp -r /tmp/save/lib lib
          cp /tmp/save/pubspec.yaml pubspec.yaml

      - name: Ajouter ton App ID AdMob
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tools/patch_android.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Télécharger les paquets
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: APK de TEST (pubs de test)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-shrink && cp build/app/outputs/flutter-apk/app-release.apk sunny-TEST.apk

      - name: Activer KVM (faux téléphone)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: DIAGNOSTIC - tester l'app et lire l'erreur
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: ${{ env.APP_DIR }}
          script: |
            adb install -r sunny-TEST.apk
            adb logcat -c
            adb shell monkey -p com.sunnydune.sunny_dune_dash -c android.intent.category.LAUNCHER 1
            sleep 20
            echo "===== RESULTAT DU TEST ====="
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "L'APP A PLANTE"; adb logcat -d | grep "Caused by" | head -10; else echo "L'APP DEMARRE SANS PLANTER"; fi

      - name: APK PRODUCTION (vraies pubs)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-shrink --dart-define=PROD=true && cp build/app/outputs/flutter-apk/app-release.apk sunny-PROD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sunny-dune-dash-apk
          path: |
            ${{ env.APP_DIR }}/sunny-TEST.apk
            ${{ env.APP_DIR }}/sunny-PROD.apk
